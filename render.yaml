services:
  - type: web
    name: trustshield-backend
    runtime: python
    plan: 1c-2g

    buildCommand: pip install -r backend/requirements.txt

    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /healthz

    envVars:
      - key: APP_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: LOG_LEVEL
        value: INFO

      - key: CORS_ORIGINS
        sync: false

  - type: web
    runtime: static
    name: trustshield-frontend

    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        sync: false

      - key: VITE_WS_BASE_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html